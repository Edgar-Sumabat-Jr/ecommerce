name: Django + React CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  permissions:
    contents: read
    packages: write
  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Check
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: False
          DB_NAME: ci_db
          DB_USER: ci_user
          DB_PASSWORD: ci_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py check

      - name: Check for Missing Migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: False
          DB_NAME: ci_db
          DB_USER: ci_user
          DB_PASSWORD: ci_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py makemigrations --check --dry-run



      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/reactjs-vite/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/reactjs-vite
        run: npm ci

      - name: Build React Application
        working-directory: frontend/reactjs-vite
        run: npm run build

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Build Docker Images
        run: docker compose build


      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Backend Docker Image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t ghcr.io/edgar-sumabat-jr/ecommerce-backend:latest \
            ./backend


      - name: Push Backend Docker Image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/edgar-sumabat-jr/ecommerce-backend:latest